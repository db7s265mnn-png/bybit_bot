[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Modular Bybit V5 trading infrastructure (Phase 1: exchange connectivity)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pybit>=5.17.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=8.5",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
]

[project.scripts]
trading-bot = "trading_bot.main:main"

[tool.setuptools.packages.find]
include = ["trading_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests without network",
    "integration: tests that call Bybit public or private API",
    "private: tests that require BYBIT_API_KEY / BYBIT_API_SECRET",
]
timeout = 60
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
